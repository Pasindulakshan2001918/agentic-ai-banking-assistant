<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Assistant</title>
<style>
  :root {
    --bg:#0f1117; --surface:#1a1d27; --surface2:#252836; --border:#2e3147;
    --accent:#4f8ef7; --accent2:#6c63ff; --text:#e8eaf6; --text2:#9196b0;
    --user-bubble:#1e3a6e; --bot-bubble:#1e2235;
    --success:#22c55e; --warning:#f59e0b; --error:#ef4444; --radius:16px;
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  /* Header */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .header-info{flex:1;min-width:0;}
  .header-title{font-size:16px;font-weight:700;}
  .header-sub{font-size:12px;color:var(--text2);margin-top:1px;}
  .lang-badge{font-size:11px;font-weight:600;padding:3px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--text2);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#6b7280;flex-shrink:0;transition:background 0.3s;}
  .status-dot.online{background:var(--success);box-shadow:0 0 6px var(--success);}
  .status-dot.loading{background:var(--warning);}
  .status-dot.error{background:var(--error);}

  /* Login */
  #login-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;width:100%;max-width:380px;}
  .login-card h2{font-size:22px;font-weight:700;margin-bottom:6px;}
  .login-card p{color:var(--text2);font-size:14px;margin-bottom:24px;}
  .demo-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
  .demo-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all 0.15s;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .form-group{margin-bottom:16px;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;}
  .form-group input,.form-group select{width:100%;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:var(--font);outline:none;transition:border-color 0.2s;}
  .form-group input:focus,.form-group select:focus{border-color:var(--accent);}
  .form-group select option{background:var(--surface2);}
  .btn-primary{width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:600;font-family:var(--font);transition:opacity 0.2s,transform 0.1s;}
  .btn-primary:hover{opacity:0.92;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  #login-error{color:var(--error);font-size:13px;margin-top:10px;text-align:center;display:none;}

  /* Chat */
  #chat-screen{flex:1;display:none;flex-direction:column;overflow:hidden;}
  #info-bar{background:rgba(79,142,247,0.08);border-bottom:1px solid rgba(79,142,247,0.15);padding:8px 16px;font-size:12px;color:var(--text2);display:flex;align-items:center;justify-content:space-between;}
  #new-session-btn{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:var(--font);}
  #new-session-btn:hover{text-decoration:underline;}
  #messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;}
  #messages::-webkit-scrollbar{width:4px;}
  #messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .msg{display:flex;gap:10px;max-width:85%;animation:fadeUp 0.2s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg.bot{align-self:flex-start;}
  .avatar{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .msg.bot .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .msg.user .avatar{background:var(--surface2);border:1px solid var(--border);}
  .bubble{padding:11px 15px;border-radius:14px;font-size:14.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap;}
  .msg.user .bubble{background:var(--user-bubble);border-bottom-right-radius:4px;}
  .msg.bot  .bubble{background:var(--bot-bubble);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.bot.error .bubble{border-color:var(--error);background:rgba(239,68,68,0.08);color:var(--error);}
  .msg-time{font-size:10px;color:var(--text2);margin-top:4px;}
  .msg.user .msg-time{text-align:right;}

  .typing .bubble{padding:14px 16px;}
  .typing-dots{display:flex;gap:4px;}
  .typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:bounce 1.2s infinite;}
  .typing-dots span:nth-child(2){animation-delay:0.2s;}
  .typing-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  .txn-badge{margin-top:8px;padding:10px 14px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:10px;font-size:13px;color:var(--success);font-weight:500;}

  /* Quick replies */
  #quick-replies{padding:8px 16px 4px;display:flex;gap:6px;flex-wrap:wrap;min-height:40px;}
  .qr-chip{font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
  .qr-chip:hover{border-color:var(--accent);color:var(--accent);}

  /* Input */
  #input-area{padding:12px 16px 20px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
  .input-row{display:flex;gap:8px;align-items:flex-end;}
  #msg-input{flex:1;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:15px;font-family:var(--font);resize:none;outline:none;max-height:120px;line-height:1.4;transition:border-color 0.2s;}
  #msg-input:focus{border-color:var(--accent);}
  #msg-input::placeholder{color:var(--text2);}
  #send-btn{width:44px;height:44px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity 0.2s,transform 0.1s;}
  #send-btn:hover{opacity:0.9;}
  #send-btn:active{transform:scale(0.95);}
  #send-btn:disabled{opacity:0.4;cursor:not-allowed;}
  #char-hint{font-size:11px;color:var(--text2);margin-top:5px;text-align:right;}
</style>
</head>
<body>

<header>
  <div class="logo">🏦</div>
  <div class="header-info">
    <div class="header-title">Bank Assistant</div>
    <div class="header-sub" id="header-sub">Digital Banking · AI Powered</div>
  </div>
  <span class="lang-badge" id="lang-badge">EN</span>
  <div class="status-dot" id="status-dot"></div>
</header>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <h2>Sign in</h2>
    <p>Enter your Customer ID to start a banking session.</p>
    <div class="demo-label">Demo accounts</div>
    <div class="demo-chips">
      <div class="chip" onclick="fillCif('CIF0001','si')">Nimal · CIF0001 (SI)</div>
      <div class="chip" onclick="fillCif('CIF0002','ta')">Kavitha · CIF0002 (TA)</div>
      <div class="chip" onclick="fillCif('CIF0003','en')">Ruwan · CIF0003 (EN)</div>
    </div>
    <div class="form-group">
      <label>Customer ID (CIF)</label>
      <input type="text" id="cif-input" placeholder="e.g. CIF0001" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Language</label>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="si">සිංහල (Sinhala)</option>
        <option value="ta">தமிழ் (Tamil)</option>
      </select>
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Start Banking Session</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <div id="info-bar">
    <span id="info-text"></span>
    <button id="new-session-btn" onclick="newSession()">New session</button>
  </div>
  <div id="messages"></div>
  <div id="quick-replies"></div>
  <div id="input-area">
    <div class="input-row">
      <textarea id="msg-input" rows="1" placeholder="Type your message…"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMsg()">&#10148;</button>
    </div>
    <div id="char-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
  </div>
</div>

<script>
const GATEWAY = 'http://localhost:8290';
let sessionId = null, customerName = null, lang = 'en', isLoading = false;

const QR = {
  en: ['Check balance','Pay CEB bill','Transfer money','Pay Dialog bill','Block my card','Loan details'],
  si: ['ශේෂය පරීක්ෂා කරන්න','CEB බිල් ගෙවන්න','මුදල් මාරු කරන්න','Dialog බිල් ගෙවන්න'],
  ta: ['இருப்பு சரிபார்','CEB கட்டணம் செலுத்து','பணம் பரிமாற்றம்','அட்டையை முடக்கு'],
};
const PH = {
  en:'Type your message…', si:'ඔබේ පණිවිඩය ලියන්න…', ta:'உங்கள் செய்தியை தட்டச்சு செய்யுங்கள்…'
};

// ── Login ─────────────────────────────────────────────────────────────────
function fillCif(cif, l) {
  document.getElementById('cif-input').value = cif;
  document.getElementById('lang-select').value = l;
}

async function doLogin() {
  const cif = document.getElementById('cif-input').value.trim();
  const ls  = document.getElementById('lang-select').value;
  if (!cif) { showErr('Please enter your Customer ID.'); return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  setDot('loading');
  try {
    const r = await fetch(`${GATEWAY}/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({cif, lang:ls})
    });
    if (!r.ok) { const e=await r.json(); throw new Error(e.detail||'Login failed'); }
    const d = await r.json();
    sessionId = d.session_id; customerName = d.customer_name; lang = ls;
    document.getElementById('login-screen').style.display = 'none';
    const cs = document.getElementById('chat-screen'); cs.style.display = 'flex';
    document.getElementById('header-sub').textContent = (customerName||'Customer')+' · '+cif;
    document.getElementById('lang-badge').textContent  = lang.toUpperCase();
    document.getElementById('info-text').textContent   = 'Session: '+sessionId.slice(0,8)+'… · Gateway: '+GATEWAY;
    document.getElementById('msg-input').placeholder   = PH[lang]||PH.en;
    setDot('online'); showQR(); addGreeting();
    document.getElementById('msg-input').focus();
  } catch(e) {
    showErr(e.message); btn.disabled=false; btn.textContent='Start Banking Session'; setDot('error');
  }
}
function showErr(m){ const e=document.getElementById('login-error'); e.textContent=m; e.style.display='block'; }
document.getElementById('cif-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

// ── Greeting ──────────────────────────────────────────────────────────────
function addGreeting() {
  const n = customerName?.split(' ')[0] || '';
  const g = {
    en:`Hello ${n}! I'm your banking assistant. I can help you check balances, pay bills, transfer money, and more. What can I do for you today?`,
    si:`ආයුබෝවන් ${n}! මම ඔබේ බැංකු සහායකයා. ශේෂය, බිල් ගෙවීම්, මුදල් මාරු කිරීම් සහ තවත් කටයුතු සඳහා සහාය ලබාදෙමි. අද ඔබට කුමක් කළ හැකිද?`,
    ta:`வணக்கம் ${n}! நான் உங்கள் வங்கி உதவியாளர். இருப்பு சரிபார்ப்பு, கட்டணம், பரிமாற்றம் மற்றும் பலவற்றில் உதவலாம். இன்று என்ன செய்யலாம்?`
  };
  addBot(g[lang]||g.en);
}

// ── Messages ──────────────────────────────────────────────────────────────
function m(){ return document.getElementById('messages'); }
function scrollBot(){ const el=m(); el.scrollTop=el.scrollHeight; }
function nowT(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

function addUser(text){
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="avatar">👤</div><div><div class="bubble">${esc(text)}</div><div class="msg-time">${nowT()}</div></div>`;
  m().appendChild(d); scrollBot();
}
function addBot(text, isErr=false){
  const d=document.createElement('div'); d.className='msg bot'+(isErr?' error':'');
  const txnM = text.match(/TXN-[\w-]+/);
  const badge = txnM ? `<div class="txn-badge">✅ Ref: ${esc(txnM[0])}</div>` : '';
  d.innerHTML=`<div class="avatar">🏦</div><div><div class="bubble">${esc(text)}${badge}</div><div class="msg-time">${nowT()}</div></div>`;
  m().appendChild(d); scrollBot();
}
function addTyping(){
  const d=document.createElement('div'); d.className='msg bot typing'; d.id='typ';
  d.innerHTML=`<div class="avatar">🏦</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  m().appendChild(d); scrollBot(); return d;
}
function removeTyping(){ document.getElementById('typ')?.remove(); }

// ── Send ──────────────────────────────────────────────────────────────────
function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }

async function sendMsg(text=null){
  if(isLoading) return;
  const inp=document.getElementById('msg-input');
  const msg=(text??inp.value).trim();
  if(!msg||!sessionId) return;
  inp.value=''; autoResize(inp);
  addUser(msg); clearQR(); setLoad(true); addTyping();
  try {
    const r=await fetch(`${GATEWAY}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sessionId,message:msg})});
    removeTyping();
    if(!r.ok){const e=await r.json();throw new Error(e.detail||'Error');}
    const d=await r.json();
    if(d.lang&&d.lang!==lang){
      lang=d.lang;
      document.getElementById('lang-badge').textContent=lang.toUpperCase();
      document.getElementById('msg-input').placeholder=PH[lang]||PH.en;
    }
    addBot(d.reply||'');
    updateQR(d.reply||'');
  } catch(e){
    removeTyping(); addBot('Sorry, something went wrong. Please try again.',true);
  } finally { setLoad(false); }
}

// ── Quick replies ─────────────────────────────────────────────────────────
function showQR(){
  const chips=QR[lang]||QR.en;
  document.getElementById('quick-replies').innerHTML=chips.map(c=>
    `<div class="qr-chip" onclick="sendMsg(${JSON.stringify(c)})">${c}</div>`).join('');
}
function updateQR(reply){
  const r=reply.toLowerCase();
  let chips=[];
  if(r.includes('confirm')||r.includes('shall i')||r.includes('shall i go ahead')||r.includes('ඉදිරියට')||r.includes('முன்னெடுக்க')){
    chips = lang==='si'?['ඔව්, ඉදිරියට යන්න','නැහැ, අවලංගු කරන්න']:
            lang==='ta'?['ஆம், தொடரவும்','இல்லை, ரத்து செய்யவும்']:
            ['Yes, proceed','No, cancel'];
  } else if(r.includes('otp')){
    chips = lang==='si'?['OTP නැවත ගෙන්වන්න']:lang==='ta'?['OTP மீண்டும் அனுப்பு']:['Resend OTP'];
  } else if(r.includes('receipt')||r.includes('රිසිට්')||r.includes('ரசீது')){
    chips = lang==='si'?['ඔව්, රිසිට්පත ගෙන්වන්න','ස්තූතියි']:
            lang==='ta'?['ஆம், ரசீது வேண்டும்','நன்றி']:
            ['Yes, get receipt','No thanks'];
  } else { showQR(); return; }
  document.getElementById('quick-replies').innerHTML=chips.map(c=>
    `<div class="qr-chip" onclick="sendMsg(${JSON.stringify(c)})">${c}</div>`).join('');
}
function clearQR(){ document.getElementById('quick-replies').innerHTML=''; }

// ── Helpers ───────────────────────────────────────────────────────────────
function setDot(s){ document.getElementById('status-dot').className='status-dot '+(s||''); }
function setLoad(v){
  isLoading=v;
  document.getElementById('send-btn').disabled=v;
  document.getElementById('msg-input').disabled=v;
  setDot(v?'loading':'online');
}
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
function newSession(){
  sessionId=null; customerName=null; lang='en';
  document.getElementById('chat-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('messages').innerHTML='';
  document.getElementById('cif-input').value='';
  const btn=document.getElementById('login-btn'); btn.disabled=false; btn.textContent='Start Banking Session';
  document.getElementById('login-error').style.display='none';
  setDot('');
}
</script>
</body>
</html>
