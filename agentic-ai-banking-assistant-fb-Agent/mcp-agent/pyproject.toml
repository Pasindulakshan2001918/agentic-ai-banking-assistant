[project]
name = "bank-mcp-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
