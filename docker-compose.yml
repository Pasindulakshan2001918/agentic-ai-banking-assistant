version: "3.8"

services:
  db:
    image: postgres:16
    container_name: bankdb
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ./core-api
    container_name: bank-core-api
    environment:
      - DB_URL=jdbc:postgresql://db:5432/bank
      - DB_USER=bank
      - DB_PASSWORD=bank
      - SPRING_PROFILES_ACTIVE=dev
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-System Administrator}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  mcp-agent:
    build:
      context: ./mcp-agent
    container_name: bank-mcp-agent
    command: ["uvicorn", "gateway:app", "--host", "0.0.0.0", "--port", "8290"]
    environment:
      - BANK_API_URL=http://core-api:8081
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8290
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-gemini/gemini-2.5-flash-lite}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-gemini/gemini-2.5-flash}
    ports:
      - "8290:8290"
    depends_on:
      - core-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8290/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-ui:
    image: nginx:alpine
    container_name: bank-chat-ui
    volumes:
      - ./chat-ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
