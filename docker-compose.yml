version: "3.8"

services:
  db:
    image: postgres:16
    container_name: bankdb
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ./core-api
    container_name: bank-core-api
    environment:
      - DB_URL=jdbc:postgresql://db:5432/bank
      - DB_USER=bank
      - DB_PASSWORD=bank
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  mcp-agent:
    build:
      context: ./mcp-agent
    container_name: bank-mcp-agent
    environment:
      - BANK_API_URL=http://core-api:8081
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8290
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - .env
    ports:
      - "8290:8290"
    depends_on:
      - core-api

  chat-ui:
    image: nginx:alpine
    container_name: bank-chat-ui
    volumes:
      - ./chat-ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
