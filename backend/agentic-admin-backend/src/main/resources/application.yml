jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNg==}
  expiration-ms: 86400000

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agenticdb
    username: admin
    password: adminpass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        # 🔒 SERIALIZABLE isolation for financial transactions
        # Prevents all anomalies (dirty reads, non-repeatable reads, phantom reads)
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        # Pessimistic locking strategy for high-concurrency transfers
        use_crud_optimizations: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # Transaction Configuration for Critical Operations
  transaction:
    default-timeout: 30
    # Rollback on any exception for data consistency
    rollback-on-commit-failure: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/agentic-bank

sms:
  provider: twilio
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:your-account-sid-here}
    auth-token: ${TWILIO_AUTH_TOKEN:your-auth-token-here}
    from-number: ${TWILIO_FROM_NUMBER:+1234567890}
  enabled: ${SMS_ENABLED:false}

# Transfer Configuration (Externalized)
transfer:
  instant:
    limit: 250000      # Max instant transfer: 250k
  daily:
    limit: 5000000     # Max daily transfer: 5M
  daily-transaction-count-limit: 100  # Max transactions per day

logging:
  level:
    com.agentic: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.engine.transaction.internal: DEBUG  # Transaction logging
